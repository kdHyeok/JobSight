worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

# ─────────────────────────────────────────────────────────────────────────────
# 백엔드로 프록시하는 접두사 (이 표가 nginx 가 아는 경로의 전부다)
#
#   /api/          REST API (요청 관리·경험 /api/experiences 포함) backend ApiPaths.API
#   /mcp /.well-known/ MCP 및 OAuth 검색       backend ApiPaths.MCP/MCP_METADATA/OAUTH_METADATA
#   /plugin/       공개 설정·SKILL·ZIP       backend ApiPaths.PLUGIN_CONFIG/PLUGIN_SKILL/PLUGIN_DOWNLOAD
#   /plugin        플러그인 연결 가이드 SPA
#   /oauth2/       Google 로그인 시작         backend ApiPaths.OAUTH_AUTHORIZATION
#   /login/        Google 로그인 콜백         backend ApiPaths.OAUTH_CALLBACK
#   /swagger-ui    API 문서 UI (ADMIN)       springdoc 기본값
#   /v3/           OpenAPI JSON (ADMIN)      springdoc 기본값
#   /admin         SPA 라우트, auth_request 게이트 후 index.html
#   /positions /companies /resumes /introductions  SPA 라우트, location / 가 index.html 을 돌려준다 (게이트 없음)
#
# 백엔드 상수:   backend/src/main/java/com/jobsight/company/common/ApiPaths.java
# 프런트 상수:   frontend/src/routes.ts
# 경로를 추가하면 이 표와 위 두 파일을 함께 갱신한다.
#
# 절대 URL 은 만들지 않는다. nginx 는 컨테이너 안에서 80 을 듣지만 밖에서는 8088(또는 공개 도메인 443)이라
# $host / $server_port 로 조립한 URL 은 반드시 어긋난다. 리다이렉트는 상대 경로,
# 프록시 헤더는 브라우저가 보낸 Host 원본($http_host)만 넘긴다.
# 스킴은 예외다 — 앞단이 TLS 를 종단하므로 X-Forwarded-Proto 의 "https" 만 받아 넘긴다($forwarded_proto).
# ─────────────────────────────────────────────────────────────────────────────

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    sendfile on;
    # 이력서 증빙 첨부(10MB) + multipart 오버헤드. 백엔드 상한과 함께 움직인다 — docs/attachments.md.
    client_max_body_size 12m;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # 모든 프록시 블록이 같은 헤더를 넘긴다. 클라이언트가 보낸 X-Forwarded-* 는 신뢰하지 않는다.
    map $http_host $forwarded_host { default $http_host; }

    # 예외: 스킴만은 앞단 프록시의 값을 받는다. 이 nginx 는 컨테이너 안에서 평문 80 을 들으므로
    # $scheme 은 언제나 http 다. 그 값을 넘기면 Tomcat 이 상대 리다이렉트를 http:// 절대 URL 로
    # 바꿔 버려 OAuth 클라이언트가 평문 홉을 만난다(실제로 그랬다).
    # "https" 라는 정확한 값만 받아들이고 나머지는 실제 스킴으로 떨어뜨린다 —
    # 임의 문자열을 그대로 신뢰하지는 않는다. 직접 8088 로 붙는 로컬 접속은 http 로 남는다.
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        "https"  "https";
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # 기본값(absolute_redirect on)은 Location 을 http://127.0.0.1/ 처럼 포트 없이 만든다.
        absolute_redirect off;

        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'ok';
        }

        # 관리자 페이지 셸은 관리자 세션이 있을 때만 내려준다.
        # 실제 데이터 보호는 /api/admin/** 의 hasRole('ADMIN') 이 담당하고,
        # 이 블록은 관리자 UI 자체를 비관리자에게 노출하지 않기 위한 한 겹이다.
        location = /admin {
            auth_request /_admin_gate;
            error_page 401 403 = @admin_denied;
            try_files /index.html =404;
        }

        location @admin_denied {
            return 302 /;
        }

        location = /_admin_gate {
            internal;
            proxy_pass http://backend:8080/api/auth/admin-check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Original-URI $request_uri;
        }

        location /api/ {
            proxy_pass http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $forwarded_host;
        }

        location = /mcp {
            proxy_pass http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_buffering off;
        }

        location = /plugin {
            try_files /index.html =404;
        }

        location /plugin/ {
            proxy_pass http://backend:8080;
            proxy_set_header Host $http_host;
        }

        location /.well-known/ {
            proxy_pass http://backend:8080;
            proxy_set_header Host $http_host;
        }

        location /oauth2/ {
            proxy_pass http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $forwarded_host;
        }

        location /login/ {
            proxy_pass http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $forwarded_host;
        }

        # API 문서. 접근 제어는 백엔드 SecurityConfig(ADMIN)가 한다.
        location /swagger-ui {
            proxy_pass http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $forwarded_host;
        }

        location /v3/ {
            proxy_pass http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $forwarded_host;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
