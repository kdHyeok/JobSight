name: jobsite-v006

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - source: db_password
        target: postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - app
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      additional_contexts:
        plugin: ./plugins/jobsight
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
      # 브라우저가 보는 주소. OAuth redirect_uri 를 이 값으로 조립한다.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8088}
      # 이 이메일의 Google 계정은 항상 ADMIN 이다.
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL}
      # client-id 는 비밀이 아니다. 비어 있으면 Google 로그인이 비활성 상태로 기동한다.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      # TLS 종단(리버스 프록시) 뒤에 둘 때만 true 로 바꾼다.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      # 의미 검색 임베딩 서버(내부 네트워크). 비우면 의미 검색을 끄고 검색은 degraded:["dense"] 로 동작한다.
      EMBEDDER_URL: ${EMBEDDER_URL-http://embedder:8000}
    secrets:
      # 파일 이름이 그대로 Spring 프로퍼티 키가 된다(configtree:/run/secrets/).
      - source: db_password
        target: spring.datasource.password
      - source: google_client_secret
        target: app.google.client-secret
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 60s
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - app
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  # 의미 검색 임베딩 서버(설계 4.4). 내부 네트워크에만 붙고 호스트 포트·nginx 경로가 없다.
  # 기본 CPU. GPU 는 compose.gpu.yaml 오버라이드. 멈춰 있어도 저장은 성공하고 검색은 degraded 로 동작한다 —
  # 그래서 backend 가 이 컨테이너를 기다리지 않는다(첫 기동은 모델을 내려받느라 몇 분 걸린다).
  embedder:
    build:
      context: ./embedder
    restart: unless-stopped
    environment:
      EMBEDDER_MODEL: ${EMBEDDER_MODEL:-dragonkue/multilingual-e5-small-ko-v2}
    volumes:
      - embedder-models:/models
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 300s
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - app
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/api/auth/login-options | grep -q '\"googleEnabled\"'"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - app
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
  # embedder 모델 캐시(HF_HOME). 지워도 다음 기동에 다시 내려받는다.
  embedder-models:

secrets:
  db_password:
    file: ./.secrets/postgres_password
  # 파일이 비어 있으면 Google 로그인만 비활성된다. 파일 자체는 존재해야 한다.
  google_client_secret:
    file: ./.secrets/google_client_secret

networks:
  app:
    driver: bridge
