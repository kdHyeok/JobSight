# Legacy JobSight origin. Install as reverse-proxy/conf.d/40-job.conf.
# Canonical target is fixed; never forward OAuth codes, cookies or Bearer credentials.
server {
    listen 8443 ssl;
    http2 on;
    server_name job.donhse.duckdns.org;
    ssl_certificate /etc/letsencrypt/live/donhse.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/donhse.duckdns.org/privkey.pem;
    include /etc/nginx/conf.d/inc/public-common.inc;

    location = /health { return 200 'ok'; }

    location ~ ^/\.well-known/oauth-(authorization-server|protected-resource(/mcp)?)$ {
        if ($request_method !~ ^(GET|HEAD)$) { return 410; }
        set $job_up "jobsite-v006-frontend-1:80";
        proxy_pass http://$job_up;
        proxy_set_header Host job.donyk.link;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Origin "";
    }

    location = /mcp {
        default_type application/json;
        # A location-level add_header stops nginx from inheriting server headers.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header WWW-Authenticate 'Bearer resource_metadata="https://job.donyk.link/.well-known/oauth-protected-resource", scope="jobsight.read jobsight.write"' always;
        return 401 '{"error":"domain_changed","mcp_url":"https://job.donyk.link/mcp"}';
    }

    location = /login/oauth2/code/google {
        if ($request_method !~ ^(GET|HEAD)$) { return 410; }
        return 302 https://job.donyk.link/?authError=DOMAIN_CHANGED;
    }

    location ~ ^/oauth2/(authorize|token|revoke|introspect)$ {
        default_type application/json;
        return 400 '{"error":"invalid_target","error_description":"Reconnect at https://job.donyk.link/plugin"}';
    }

    # Only known browser entry paths redirect; all query parameters are discarded.
    location ~ ^/(oauth2/authorization/google|plugin|positions|companies|resumes|introductions|admin)?$ {
        if ($request_method !~ ^(GET|HEAD)$) { return 410; }
        return 302 https://job.donyk.link$uri;
    }

    location / {
        default_type application/json;
        return 410 '{"error":"domain_changed","url":"https://job.donyk.link"}';
    }
}
