# main 에 올라간 커밋을 운영(https://job.donyk.link)에 반영한다.
#
# 운영 서버는 가정집 LAN 안에 있고 인바운드 SSH 가 없다. 그래서 GitHub 호스티드
# 러너가 닿지 못하고, 서버에 셀프호스티드 러너를 두고 러너가 GitHub 를 폴링한다.
# 이미지 레지스트리는 쓰지 않는다(docs/nginx-deploy.md) — 서버가 소스에서 빌드한다.
#
# 공개 저장소 + 셀프호스티드 러너는 위험한 조합이다. 그래서:
#   - pull_request 로는 절대 돌지 않는다. main push 와 수동 실행뿐이다.
#   - 포크에서는 돌지 않는다(repository 검사).
#   - 테스트는 호스티드 러너에서 끝내고, 운영 머신은 배포만 한다.
name: cd

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 배포는 겹치면 안 된다. 취소하지 않고 줄을 세운다.
concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  tests:
    if: github.repository == 'kdHyeok/JobSight'
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: tests
    runs-on: [self-hosted, linux, jobsite-prod]
    # 첫 배포는 embedder 이미지(약 2GB)와 모델(약 470MB)을 받는다.
    timeout-minutes: 60
    environment:
      name: production
      url: https://job.donyk.link
    steps:
      # 체크아웃하지 않는다. 배포는 러너 작업공간이 아니라 운영 디렉터리에서
      # 돌아야 한다 — .env·.secrets·DB 볼륨·compose 프로젝트가 거기에 묶여 있다.
      - name: 배포
        env:
          JOBSITE_DIR: ${{ vars.JOBSITE_DIR || '/home/quincy/HDD/workspaces/job_site/demo/v006' }}
          SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          cd "$JOBSITE_DIR"
          bash scripts/deploy.sh origin/main

      - name: 요약
        if: always()
        env:
          JOBSITE_DIR: ${{ vars.JOBSITE_DIR || '/home/quincy/HDD/workspaces/job_site/demo/v006' }}
        run: |
          cd "$JOBSITE_DIR"
          {
            echo "### 배포 결과: ${{ job.status }}"
            echo ""
            echo "- 트리거 커밋: \`${{ github.sha }}\`"
            echo "- 배포된 커밋: \`$(git rev-parse HEAD)\` $(git log -1 --pretty=%s)"
            echo ""
            echo '```'
            docker compose -f compose.yaml -f compose.mcp.yaml ps --format '{{.Service}}\t{{.Status}}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
