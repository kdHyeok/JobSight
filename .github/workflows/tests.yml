# 백엔드·프런트 검사. PR 게이트(ci.yml)가 부른다.
# GitHub 호스티드 러너에서만 돈다 — 운영 머신을 건드리지 않는다.
name: tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  smoke-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/test-smoke-curl.sh

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        # backend/build.gradle 이 ../plugins/jobsight 를 리소스로 넣는다.
        # 저장소 전체를 받아야 PluginGuideController 테스트가 통과한다.
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: gradle test
        working-directory: backend
        run: ./gradlew test --no-daemon
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run type-check
        working-directory: frontend
      - run: npm test
        working-directory: frontend
